# Hermes profile configuration — promo-in
#
# Intentionally minimal. Nothing here is required by the Threads scraping or
# auto-reply workflow: session handling lives in storage_state.json (see
# README §2) and the reply flow is driven by the skills under
# skills/social-media/.
#
# Model and provider are machine-specific and are deliberately NOT shipped.
# Configure them once on the target machine:
#
#   hermes -p promo-in setup
#   hermes -p promo-in config set model.default <model-id>
#   hermes -p promo-in config set model.provider <provider>
#
# For an OpenAI-compatible endpoint, add a custom provider referencing an
# environment variable instead of a literal key:
#
#   custom_providers:
#     - name: my-provider
#       base_url: https://api.example.com/v1
#       key_env: MY_PROVIDER_API_KEY
#       model: <model-id>
#
# Behavioral settings belong in this file; secrets belong in ~/.hermes/profiles/promo-in/.env
# (never committed — see .gitignore).
_config_version: 34
