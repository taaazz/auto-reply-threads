name: promo-in
version: 0.3.0
description: "AI agent auto reply threads — HKI/merek/paten lead scraping + reply agent"
hermes_requires: ">=0.12.0"
author: "taaazz"
license: "MIT"

# No environment variables are required by this distribution.
# Session state lives in storage_state.json (see README §2); the reply flow is
# Playwright-driven and needs no third-party API keys.
env_requires: []

# Only these paths are installed/updated by `hermes profile install|update`.
# Deliberately narrow: ONLY the Threads scraping + auto-reply skills ship.
# memories/ is not here — Hermes treats memories as user-owned and never
# overwrites them; it is versioned in this repo as a readable mirror only.
distribution_owned:
  - SOUL.md
  - soul.md
  - config.yaml
  - skills/social-media/threads-automation
  - skills/social-media/threads-engagement-automation
  - skills/social-media/threads-lead-engagement
  - skills/social-media/threads-lead-generation
  - skills/social-media/threads-reply-agent
